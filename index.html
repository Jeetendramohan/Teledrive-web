<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>TeleCloud Drive v2</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #0284c7;
            --primary-soft: #e0f2fe;
            --danger: #ef4444;
            --danger-soft: #fee2e2;
            --success: #16a34a;
            --radius: 14px;
            --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 90px; min-height: 100vh; }

        #loginScreen { max-width: 400px; margin: 48px auto; padding: 28px 24px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07); width: calc(100% - 32px); }
        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-logo { width: 56px; height: 56px; background: var(--primary-soft); color: var(--primary); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .brand-header h2 { font-size: 22px; font-weight: 700; color: var(--text); }
        .brand-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg); color: var(--text); transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary); background: var(--surface); }

        .btn { border: none; border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-soft { background: var(--surface-2); color: var(--text); }
        .btn-full { width: 100%; padding: 14px; font-size: 15px; margin-top: 6px; }

        #workspace { display: none; max-width: 900px; margin: 0 auto; }

        .topbar { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-logo { width: 34px; height: 34px; background: var(--primary); color: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
        .top-actions { display: flex; gap: 6px; }
        .icon-btn { background: var(--surface-2); color: var(--text); border: none; border-radius: 10px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; }
        .icon-btn:active { transform: scale(0.93); }

        .controls-wrap { padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 10px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 11px 14px 11px 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; outline: none; }
        .search-box input:focus { border-color: var(--primary); }
        .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

        .action-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .action-pills::-webkit-scrollbar { display: none; }
        .pill-btn { flex: 1; white-space: nowrap; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .pill-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pill-btn.trash-active { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }

        .path-bar { margin: 6px 16px 8px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .path-text { font-size: 13px; font-weight: 600; color: var(--primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .back-btn { background: var(--primary-soft); color: var(--primary); border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

        #uploadProgressWrap { display: none; margin: 0 16px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
        .progress-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .progress-track { width: 100%; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.2s; }

        #fileContainer { padding: 4px 16px 16px; }
        .list-view { display: flex; flex-direction: column; gap: 8px; }
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }

        .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; transition: 0.15s; box-shadow: var(--shadow); }
        .item-card:active { transform: scale(0.99); background: #f8fafc; }

        .item-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
        .thumb-box { width: 46px; height: 46px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; position: relative; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-box.folder-bg { background: #fef3c7; color: #d97706; }

        .item-info { overflow: hidden; flex: 1; }
        .item-name { font-size: 14px; font-weight: 500; color: var(--text); word-break: break-word; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
        .item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

        .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .mini-btn { border: none; background: var(--surface-2); color: var(--muted); width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .mini-btn:hover { background: var(--border); color: var(--text); }
        .mini-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

        .grid-view .item-card { flex-direction: column; padding: 10px; gap: 8px; align-items: stretch; }
        .grid-view .item-left { flex-direction: column; gap: 8px; width: 100%; text-align: center; }
        .grid-view .thumb-box { width: 100%; height: 96px; border-radius: 10px; }
        .grid-view .item-name { font-size: 12.5px; -webkit-line-clamp: 2; }
        .grid-view .item-sub { display: none; }
        .grid-view .item-actions { justify-content: center; width: 100%; border-top: 1px solid var(--surface-2); padding-top: 6px; }
        .grid-view .mini-btn { flex: 1; height: 30px; }

        .empty-msg { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; }

        .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-backdrop.open { display: flex; }
        .modal-card { background: var(--surface); border-radius: 18px; width: 100%; max-width: 360px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: pop 0.18s ease-out; }
        @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .modal-desc { font-size: 14px; color: var(--muted); line-height: 1.45; margin-bottom: 18px; word-break: break-word; }
        .modal-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; margin-bottom: 16px; outline: none; }
        .modal-input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

        #mediaViewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; }
        #mediaViewer.open { display: flex; }
        .viewer-top { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; color: #fff; gap: 12px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
        .viewer-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: hidden; position: relative; }
        .viewer-body img, .viewer-body video { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }
        .viewer-bottom { padding: 14px 16px; display: flex; justify-content: center; gap: 12px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .viewer-hint { text-align: center; color: #94a3b8; font-size: 11px; padding-bottom: 8px; }

        #statusBar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 500; display: none; z-index: 300; box-shadow: 0 8px 20px rgba(0,0,0,0.25); max-width: 90%; text-align: center; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="brand-header">
            <div class="brand-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
            </div>
            <h2>TeleCloud Drive</h2>
            <p>Private Personal Cloud Storage</p>
        </div>
        <div class="input-group">
            <label>License Key</label>
            <input type="text" id="inpKey" placeholder="e.g. VIP-DOST-1">
        </div>
        <div class="input-group">
            <label>Telegram Bot Token</label>
            <input type="password" id="inpToken" placeholder="123456:ABC-DEF...">
        </div>
        <div class="input-group">
            <label>Channel / Chat ID</label>
            <input type="text" id="inpChatId" placeholder="e.g. -100123456789">
        </div>
        <button class="btn btn-primary btn-full" onclick="login()">Enter Drive</button>
    </div>

    <div id="workspace">
        <div class="topbar">
            <div class="topbar-left">
                <div class="topbar-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                </div>
                <h1>TeleCloud</h1>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="btnView" onclick="toggleView()" title="Switch View"></button>
                <button class="icon-btn" onclick="fetchFromCloud()" title="Sync">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>
                <button class="icon-btn" onclick="confirmLogout()" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>

        <div class="controls-wrap">
            <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search in this folder..." oninput="renderFiles()">
            </div>
            <div class="action-pills">
                <button class="pill-btn primary" onclick="document.getElementById('fileInput').click()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload
                </button>
                <button class="pill-btn" onclick="openFolderModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
                    New Folder
                </button>
                <button class="pill-btn" id="btnTrash" onclick="toggleTrash()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Bin
                </button>
            </div>
        </div>

        <input type="file" id="fileInput" multiple style="display:none" onchange="handleUpload(this.files)">

        <div id="uploadProgressWrap">
            <div class="progress-top">
                <span id="uploadFileName">Uploading...</span>
                <span id="uploadPercent">0%</span>
            </div>
            <div class="progress-track"><div class="progress-fill" id="uploadFill"></div></div>
        </div>

        <div class="path-bar">
            <span class="path-text" id="pathDisplay">Home /</span>
            <button class="back-btn" id="btnBack" style="display:none" onclick="goBack()">← Back</button>
        </div>

        <div id="fileContainer" class="list-view"></div>
    </div>

    <div class="modal-backdrop" id="confirmModal">
        <div class="modal-card">
            <div class="modal-title" id="confirmTitle">Confirm</div>
            <div class="modal-desc" id="confirmDesc">Are you sure?</div>
            <div class="modal-actions">
                <button class="btn btn-soft" onclick="closeModal('confirmModal')">Cancel</button>
                <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="folderModal">
        <div class="modal-card">
            <div class="modal-title">New Folder</div>
            <input type="text" id="newFolderInput" class="modal-input" placeholder="Folder name...">
            <div class="modal-actions">
                <button class="btn btn-soft" onclick="closeModal('folderModal')">Cancel</button>
                <button class="btn btn-primary" onclick="confirmCreateFolder()">Create</button>
            </div>
        </div>
    </div>

    <div id="mediaViewer">
        <div class="viewer-top">
            <span class="viewer-title" id="viewerTitle">File</span>
            <button class="icon-btn" style="background:rgba(255,255,255,0.15);color:#fff" onclick="closeViewer()">✕</button>
        </div>
        <div class="viewer-body" id="viewerBody"></div>
        <div class="viewer-hint" id="viewerHint"></div>
        <div class="viewer-bottom">
            <button class="btn btn-primary" id="viewerDownloadBtn">Download / Open</button>
            <button class="btn btn-danger" id="viewerDeleteBtn">Delete</button>
        </div>
    </div>

    <div id="statusBar"></div>

    <script>
        const FIREBASE_URL = "https://teledrive300-default-rtdb.firebaseio.com/";
        let licenseKey = localStorage.getItem("td_key") || "";
        let botToken = localStorage.getItem("td_token") || "";
        let chatId = localStorage.getItem("td_chatId") || "";

        let fileHistory = [];
        let trashHistory = [];
        let currentPath = "/";
        let inTrash = false;
        let isGrid = localStorage.getItem("td_grid") === "true";

        const urlCache = JSON.parse(sessionStorage.getItem("td_url_cache") || "{}");
        function saveUrlCache() {
            try { sessionStorage.setItem("td_url_cache", JSON.stringify(urlCache)); } catch(e) {}
        }

        const ICONS = {
            grid: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
            list: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
            folder: `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>`,
            file: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
            video: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10 9 15 12 10 15 10 9" fill="#0284c7"/></svg>`,
            image: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            pdf: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
            download: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
            trash: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
            restore: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`
        };

        function showStatus(msg, autoHide = true) {
            const bar = document.getElementById("statusBar");
            bar.innerText = msg;
            bar.style.display = "block";
            clearTimeout(window.statusTimer);
            if (autoHide) window.statusTimer = setTimeout(() => bar.style.display = "none", 3000);
        }

        function openConfirm(title, desc, okText, okClass, onConfirm) {
            document.getElementById("confirmTitle").innerText = title;
            document.getElementById("confirmDesc").innerText = desc;
            const btn = document.getElementById("confirmOkBtn");
            btn.innerText = okText;
            btn.className = "btn " + okClass;
            btn.onclick = () => { closeModal("confirmModal"); onConfirm(); };
            document.getElementById("confirmModal").classList.add("open");
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("open");
        }

        function isImageFile(name = "") { return /\.(jpg|jpeg|png|webp|gif)$/i.test(name); }
        function isVideoFile(name = "") { return /\.(mp4|mkv|avi|mov|webm)$/i.test(name); }
        function isPdfFile(name = "") { return /\.pdf$/i.test(name); }

        async function getTelegramDirectUrl(fileId) {
            if (!fileId) return null;
            if (urlCache[fileId]) return urlCache[fileId];
            try {
                const res = await fetch(`https://api.telegram.org/bot${botToken}/getFile?file_id=${encodeURIComponent(fileId)}`);
                const data = await res.json();
                if (data.ok && data.result && data.result.file_path) {
                    const url = `https://api.telegram.org/file/bot${botToken}/${data.result.file_path}`;
                    urlCache[fileId] = url;
                    saveUrlCache();
                    return url;
                }
            } catch (e) {}
            return null;
        }

        const thumbObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const el = entry.target;
                thumbObserver.unobserve(el);
                const fid = el.dataset.thumbId;
                if (!fid) return;
                getTelegramDirectUrl(fid).then(url => {
                    if (url) {
                        const img = document.createElement("img");
                        img.src = url;
                        img.alt = "";
                        img.onload = () => { el.innerHTML = ""; el.appendChild(img); };
                    }
                });
            });
        }, { rootMargin: "150px" });

        async function login() {
            const k = document.getElementById("inpKey").value.trim();
            const t = document.getElementById("inpToken").value.trim();
            const c = document.getElementById("inpChatId").value.trim();
            if (!k || !t || !c) return showStatus("Saari details bhariye!");

            showStatus("Verifying Key...", false);
            try {
                const res = await fetch(`${FIREBASE_URL}valid_keys/${encodeURIComponent(k)}.json`);
                const val = await res.json();
                if (val === true || val === "true") {
                    licenseKey = k; botToken = t; chatId = c;
                    localStorage.setItem("td_key", k);
                    localStorage.setItem("td_token", t);
                    localStorage.setItem("td_chatId", c);
                    openWorkspace();
                } else {
                    showStatus("Invalid License Key!");
                }
            } catch (e) {
                showStatus("Network error! Dobara try karein.");
            }
        }

        function confirmLogout() {
            openConfirm("Logout?", "Kya aap TeleCloud se logout karna chahte hain?", "Logout", "btn-danger", () => {
                localStorage.removeItem("td_key");
                localStorage.removeItem("td_token");
                localStorage.removeItem("td_chatId");
                sessionStorage.removeItem("td_url_cache");
                location.reload();
            });
        }

        function openWorkspace() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("workspace").style.display = "block";
            updateViewUI();
            fetchFromCloud();
        }

        async function fetchFromCloud() {
            showStatus("Syncing...", false);
            try {
                const res = await fetch(`${FIREBASE_URL}users/${encodeURIComponent(licenseKey)}/channels/${encodeURIComponent(chatId)}.json`);
                const data = await res.json();
                fileHistory = (data && Array.isArray(data.fileHistory)) ? data.fileHistory : [];
                trashHistory = (data && Array.isArray(data.trashHistory)) ? data.trashHistory : [];
                renderFiles();
                showStatus("Synced!");
            } catch (e) {
                showStatus("Data load nahi ho paya.");
            }
        }

        async function syncToCloud() {
            try {
                await fetch(`${FIREBASE_URL}users/${encodeURIComponent(licenseKey)}/channels/${encodeURIComponent(chatId)}.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ fileHistory, trashHistory })
                });
            } catch (e) {
                showStatus("Cloud sync fail ho gaya.");
            }
        }

        function toggleView() {
            isGrid = !isGrid;
            localStorage.setItem("td_grid", isGrid);
            updateViewUI();
        }

        function updateViewUI() {
            document.getElementById("fileContainer").className = isGrid ? "grid-view" : "list-view";
            document.getElementById("btnView").innerHTML = isGrid ? ICONS.list : ICONS.grid;
        }

        function toggleTrash() {
            inTrash = !inTrash;
            const btn = document.getElementById("btnTrash");
            btn.classList.toggle("trash-active", inTrash);
            document.getElementById("searchInput").value = "";
            renderFiles();
        }

        function goBack() {
            if (currentPath === "/") return;
            const parts = currentPath.split("/").filter(Boolean);
            parts.pop();
            currentPath = parts.length ? "/" + parts.join("/") + "/" : "/";
            document.getElementById("searchInput").value = "";
            renderFiles();
        }

        function getDefaultFileSvg(name) {
            if (isImageFile(name)) return ICONS.image;
            if (isVideoFile(name)) return ICONS.video;
            if (isPdfFile(name)) return ICONS.pdf;
            return ICONS.file;
        }

        function renderFiles() {
            const container = document.getElementById("fileContainer");
            const pathDisplay = document.getElementById("pathDisplay");
            const btnBack = document.getElementById("btnBack");
            const query = document.getElementById("searchInput").value.trim().toLowerCase();

            container.innerHTML = "";

            if (inTrash) {
                pathDisplay.innerText = "Recycle Bin";
                btnBack.style.display = "none";
                const list = trashHistory.filter(i => !query || (i.name || "").toLowerCase().includes(query));
                if (list.length === 0) {
                    container.innerHTML = `<div class="empty-msg">Recycle Bin khali hai</div>`;
                    return;
                }
                list.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "item-card";

                    const left = document.createElement("div");
                    left.className = "item-left";

                    const thumb = document.createElement("div");
                    thumb.className = "thumb-box" + (item.type === "folder" ? " folder-bg" : "");
                    thumb.innerHTML = item.type === "folder" ? ICONS.folder : getDefaultFileSvg(item.name);

                    const info = document.createElement("div");
                    info.className = "item-info";
                    info.innerHTML = `<div class="item-name"></div><div class="item-sub">In Recycle Bin</div>`;
                    info.querySelector(".item-name").innerText = item.name || "Untitled";

                    left.append(thumb, info);

                    const actions = document.createElement("div");
                    actions.className = "item-actions";

                    const btnRes = document.createElement("button");
                    btnRes.className = "mini-btn";
                    btnRes.title = "Restore";
                    btnRes.innerHTML = ICONS.restore;
                    btnRes.onclick = (e) => { e.stopPropagation(); restoreItem(item); };

                    const btnDel = document.createElement("button");
                    btnDel.className = "mini-btn del";
                    btnDel.title = "Delete Permanently";
                    btnDel.innerHTML = ICONS.trash;
                    btnDel.onclick = (e) => {
                        e.stopPropagation();
                        openConfirm("Hamesha ke liye delete karein?", `"${item.name}" Telegram aur Drive dono se permanently delete ho jayegi.`, "Delete Permanently", "btn-danger", () => deletePermanently(item));
                    };

                    actions.append(btnRes, btnDel);
                    card.append(left, actions);
                    container.appendChild(card);
                });
                return;
            }

            pathDisplay.innerText = currentPath === "/" ? "Home /" : "Home" + currentPath;
            btnBack.style.display = currentPath === "/" ? "none" : "inline-block";

            const folders = fileHistory
                .filter(i => (i.path || "/") === currentPath && i.type === "folder")
                .filter(i => !query || (i.name || "").toLowerCase().includes(query))
                .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

            const files = fileHistory
                .filter(i => (i.path || "/") === currentPath && i.type !== "folder")
                .filter(i => !query || (i.name || "").toLowerCase().includes(query))
                .reverse();

            const items = [...folders, ...files];
            if (items.length === 0) {
                container.innerHTML = `<div class="empty-msg">${query ? "Koi matching file nahi mili" : "Ye folder khali hai"}</div>`;
                return;
            }

            items.forEach(item => {
                const isFolder = item.type === "folder";
                const card = document.createElement("div");
                card.className = "item-card";
                card.onclick = () => isFolder ? openFolder(item.name) : handleFileClick(item);

                const left = document.createElement("div");
                left.className = "item-left";

                const thumb = document.createElement("div");
                thumb.className = "thumb-box" + (isFolder ? " folder-bg" : "");
                thumb.innerHTML = isFolder ? ICONS.folder : getDefaultFileSvg(item.name);

                if (!isFolder) {
                    const thumbId = item.thumbFileId || (isImageFile(item.name) ? item.fileId : "");
                    if (thumbId) {
                        thumb.dataset.thumbId = thumbId;
                        thumbObserver.observe(thumb);
                    }
                }

                const info = document.createElement("div");
                info.className = "item-info";
                const ext = (!isFolder && item.name && item.name.includes(".")) ? item.name.split(".").pop().toUpperCase() : (isFolder ? "Folder" : "File");
                info.innerHTML = `<div class="item-name"></div><div class="item-sub"></div>`;
                info.querySelector(".item-name").innerText = item.name || "Untitled";
                info.querySelector(".item-sub").innerText = ext;

                left.append(thumb, info);

                const actions = document.createElement("div");
                actions.className = "item-actions";

                if (!isFolder) {
                    const btnDl = document.createElement("button");
                    btnDl.className = "mini-btn";
                    btnDl.title = "Download / Open";
                    btnDl.innerHTML = ICONS.download;
                    btnDl.onclick = (e) => { e.stopPropagation(); openExternalFile(item); };
                    actions.appendChild(btnDl);
                }

                const btnDel = document.createElement("button");
                btnDel.className = "mini-btn del";
                btnDel.title = "Move to Bin";
                btnDel.innerHTML = ICONS.trash;
                btnDel.onclick = (e) => {
                    e.stopPropagation();
                    openConfirm("Bin mein bhejein?", `Kya aap "${item.name}" ko Recycle Bin mein move karna chahte hain?`, "Move to Bin", "btn-danger", () => moveToTrash(item));
                };
                actions.appendChild(btnDel);

                card.append(left, actions);
                container.appendChild(card);
            });
        }

        function openFolder(name) {
            currentPath = currentPath + name + "/";
            document.getElementById("searchInput").value = "";
            renderFiles();
        }

        function openFolderModal() {
            if (inTrash) return showStatus("Pehle Recycle Bin se bahar aayein.");
            const inp = document.getElementById("newFolderInput");
            inp.value = "";
            document.getElementById("folderModal").classList.add("open");
            setTimeout(() => inp.focus(), 100);
        }

        async function confirmCreateFolder() {
            const name = document.getElementById("newFolderInput").value.trim();
            if (!name) return;
            closeModal("folderModal");
            fileHistory.push({ type: "folder", name, path: currentPath });
            renderFiles();
            await syncToCloud();
            showStatus("Folder ban gaya!");
        }

        function createImageThumbnail(file) {
            return new Promise((resolve) => {
                if (!file.type.startsWith("image/")) return resolve(null);
                const img = new Image();
                const objUrl = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(objUrl);
                    const scale = Math.min(320 / img.width, 320 / img.height, 1);
                    const canvas = document.createElement("canvas");
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.7);
                };
                img.onerror = () => { URL.revokeObjectURL(objUrl); resolve(null); };
                img.src = objUrl;
            });
        }

        function uploadSingleFile(file, thumbBlob, onProgress) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append("chat_id", chatId);
                if (thumbBlob) formData.append("thumbnail", thumbBlob, "thumb.jpg");
                formData.append("document", file, file.name);

                const xhr = new XMLHttpRequest();
                xhr.open("POST", `https://api.telegram.org/bot${botToken}/sendDocument`);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
                };
                xhr.onload = () => {
                    try { resolve(JSON.parse(xhr.responseText)); }
                    catch (e) { reject(e); }
                };
                xhr.onerror = () => reject(new Error("Network error"));
                xhr.send(formData);
            });
        }

        async function handleUpload(files) {
            if (inTrash) return showStatus("Pehle Recycle Bin se bahar aayein.");
            if (!files || files.length === 0) return;

            const wrap = document.getElementById("uploadProgressWrap");
            const nameEl = document.getElementById("uploadFileName");
            const pctEl = document.getElementById("uploadPercent");
            const fillEl = document.getElementById("uploadFill");
            wrap.style.display = "block";

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                nameEl.innerText = `Uploading (${i + 1}/${files.length}): ${file.name}`;
                pctEl.innerText = "0%";
                fillEl.style.width = "0%";

                try {
                    const thumbBlob = await createImageThumbnail(file);
                    const data = await uploadSingleFile(file, thumbBlob, (p) => {
                        pctEl.innerText = p + "%";
                        fillEl.style.width = p + "%";
                    });

                    if (data.ok && data.result) {
                        const r = data.result;
                        const doc = r.document || r.video || (r.photo ? r.photo[r.photo.length - 1] : null);
                        if (doc && doc.file_id) {
                            const thumbId = (doc.thumbnail && doc.thumbnail.file_id) || (doc.thumb && doc.thumb.file_id) || "";
                            fileHistory.push({
                                type: "file",
                                msgId: String(r.message_id),
                                fileId: doc.file_id,
                                name: file.name,
                                path: currentPath,
                                thumbFileId: thumbId
                            });
                            await syncToCloud();
                            renderFiles();
                        }
                    } else {
                        showStatus(`Failed: ${file.name}`);
                    }
                } catch (e) {
                    showStatus(`Upload error: ${file.name}`);
                }
            }

            wrap.style.display = "none";
            document.getElementById("fileInput").value = "";
            showStatus("Upload complete!");
        }

        async function handleFileClick(item) {
            if (isImageFile(item.name) || isVideoFile(item.name)) {
                openMediaViewer(item);
            } else {
                openExternalFile(item);
            }
        }

        async function openMediaViewer(item) {
            showStatus("Loading preview...", false);
            const url = await getTelegramDirectUrl(item.fileId);
            if (!url) return showStatus("File 20MB se badi hai ya load nahi ho payi.");
            document.getElementById("statusBar").style.display = "none";

            const viewer = document.getElementById("mediaViewer");
            const body = document.getElementById("viewerBody");
            const hint = document.getElementById("viewerHint");
            document.getElementById("viewerTitle").innerText = item.name;
            body.innerHTML = "";

            if (isImageFile(item.name)) {
                const img = document.createElement("img");
                img.src = url;
                body.appendChild(img);
                hint.innerText = "Tip: Gallery mein save karne ke liye photo par long-press karein";
            } else {
                const vid = document.createElement("video");
                vid.src = url;
                vid.controls = true;
                vid.autoplay = true;
                vid.playsInline = true;
                body.appendChild(vid);
                hint.innerText = "";
            }

            document.getElementById("viewerDownloadBtn").onclick = () => window.open(url, "_blank");
            document.getElementById("viewerDeleteBtn").onclick = () => {
                openConfirm("Bin mein bhejein?", `Kya aap "${item.name}" ko Recycle Bin mein move karna chahte hain?`, "Move to Bin", "btn-danger", () => {
                    closeViewer();
                    moveToTrash(item);
                });
            };

            viewer.classList.add("open");
        }

        function closeViewer() {
            const viewer = document.getElementById("mediaViewer");
            viewer.classList.remove("open");
            document.getElementById("viewerBody").innerHTML = "";
        }

        async function openExternalFile(item) {
            showStatus("Link nikal rahe hain...", false);
            const url = await getTelegramDirectUrl(item.fileId);
            if (!url) return showStatus("File 20MB se badi hai ya expire ho gayi hai.");
            showStatus("Opening...");
            window.open(url, "_blank");
        }

        async function moveToTrash(item) {
            const idx = fileHistory.findIndex(x => x === item || JSON.stringify(x) === JSON.stringify(item));
            if (idx !== -1) {
                fileHistory.splice(idx, 1);
                trashHistory.push(item);
                renderFiles();
                await syncToCloud();
                showStatus("Bin mein move kar diya!");
            }
        }

        async function restoreItem(item) {
            const idx = trashHistory.findIndex(x => x === item || JSON.stringify(x) === JSON.stringify(item));
            if (idx !== -1) {
                trashHistory.splice(idx, 1);
                fileHistory.push(item);
                renderFiles();
                await syncToCloud();
                showStatus("Restore ho gaya!");
            }
        }

        async function deletePermanently(item) {
            const idx = trashHistory.findIndex(x => x === item || JSON.stringify(x) === JSON.stringify(item));
            if (idx === -1) return;
            showStatus("Deleting permanently...", false);
            if (item.msgId) {
                try {
                    await fetch(`https://api.telegram.org/bot${botToken}/deleteMessage?chat_id=${encodeURIComponent(chatId)}&message_id=${encodeURIComponent(item.msgId)}`);
                } catch (e) {}
            }
            trashHistory.splice(idx, 1);
            renderFiles();
            await syncToCloud();
            showStatus("Permanently deleted!");
        }

        if (licenseKey && botToken && chatId) openWorkspace();
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>TeleCloud Drive v6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #0284c7;
            --primary-soft: #e0f2fe;
            --danger: #ef4444;
            --danger-soft: #fee2e2;
            --success: #16a34a;
            --success-soft: #dcfce7;
            --warn: #d97706;
            --warn-soft: #fef3c7;
            --radius: 14px;
            --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            --grid-cols: 3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 100px; min-height: 100vh; }

        #loginScreen { max-width: 400px; margin: 48px auto; padding: 28px 24px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07); width: calc(100% - 32px); }
        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-logo { width: 56px; height: 56px; background: var(--primary-soft); color: var(--primary); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .brand-header h2 { font-size: 22px; font-weight: 700; color: var(--text); }
        .brand-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg); color: var(--text); transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary); background: var(--surface); }

        .btn { border: none; border-radius: 12px; padding: 11px 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-soft { background: var(--surface-2); color: var(--text); }
        .btn-full { width: 100%; padding: 14px; font-size: 15px; margin-top: 6px; }

        #workspace { display: none; max-width: 900px; margin: 0 auto; }

        .topbar { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .topbar-logo { width: 34px; height: 34px; background: var(--primary); color: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
        .top-actions { display: flex; gap: 6px; }
        .icon-btn { background: var(--surface-2); color: var(--text); border: none; border-radius: 10px; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; }
        .icon-btn:active { transform: scale(0.93); }

        /* Modern Theme-Matched Batch Bar */
        #batchBar { display: none; background: rgba(240, 249, 255, 0.97); backdrop-filter: blur(10px); color: var(--text); padding: 10px 14px; position: sticky; top: 0; z-index: 30; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1.5px solid #bae6fd; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.08); }
        #batchBar.active { display: flex; }
        .batch-left { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--primary); }
        .batch-actions { display: flex; gap: 6px; align-items: center; }
        .batch-btn { background: var(--surface); color: var(--text); border: 1px solid #bae6fd; border-radius: 10px; height: 36px; min-width: 36px; padding: 0 9px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: 0.15s; }
        .batch-btn:active { transform: scale(0.94); background: var(--primary-soft); }
        .batch-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .batch-btn.danger { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
        .batch-btn.success { background: var(--success-soft); color: var(--success); border-color: #bbf7d0; }

        .controls-wrap { padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 10px; }
        .search-row { display: flex; gap: 8px; align-items: center; }
        .search-box { position: relative; flex: 1; }
        .search-box input { width: 100%; padding: 11px 14px 11px 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; outline: none; }
        .search-box input:focus { border-color: var(--primary); }
        .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .sort-btn { height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
        .sort-btn:active { background: var(--surface-2); }

        .action-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .action-pills::-webkit-scrollbar { display: none; }
        .pill-btn { flex: 1; white-space: nowrap; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .pill-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pill-btn.trash-active { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }

        .path-bar { margin: 6px 16px 8px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .path-text { font-size: 13px; font-weight: 600; color: var(--primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .back-btn { background: var(--primary-soft); color: var(--primary); border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

        #fileContainer { padding: 4px 16px 16px; }
        .list-view { display: flex; flex-direction: column; gap: 8px; }
        .grid-view { display: grid; grid-template-columns: repeat(var(--grid-cols, 3), minmax(0, 1fr)); gap: 10px; }

        .item-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; transition: 0.15s; box-shadow: var(--shadow); position: relative; user-select: none; -webkit-user-select: none; }
        .item-card:active { transform: scale(0.99); }
        .item-card.selected { border-color: var(--primary); background: #f0f9ff; }

        .select-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff; display: none; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 700; color: #fff; }
        .multi-mode .select-check { display: flex; }
        .item-card.selected .select-check { background: var(--primary); border-color: var(--primary); }

        .item-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
        .thumb-box { width: 46px; height: 46px; border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; position: relative; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .thumb-box.folder-bg { background: #fef3c7; color: #d97706; }

        .item-info { overflow: hidden; flex: 1; }
        .item-name { font-size: 14px; font-weight: 500; color: var(--text); word-break: break-word; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
        .item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

        .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .multi-mode .item-actions { display: none; }
        .mini-btn { border: none; background: var(--surface-2); color: var(--muted); width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .mini-btn:hover { background: var(--border); color: var(--text); }
        .mini-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

        .grid-view .item-card { flex-direction: column; padding: 8px; gap: 6px; align-items: stretch; }
        .grid-view .item-left { flex-direction: column; gap: 6px; width: 100%; text-align: center; }
        .grid-view .thumb-box { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 10px; }
        .grid-view .item-name { font-size: 12px; -webkit-line-clamp: 2; }
        .grid-view .item-sub { display: none; }
        .grid-view .item-actions { justify-content: center; width: 100%; border-top: 1px solid var(--surface-2); padding-top: 6px; }
        .grid-view .mini-btn { flex: 1; height: 28px; }
        .grid-view .select-check { position: absolute; top: 8px; right: 8px; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

        .empty-msg { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 14px; }

        /* Floating Upload Queue Button */
        #fabUploads { position: fixed; bottom: 22px; right: 18px; background: var(--primary); color: #fff; border: none; border-radius: 99px; height: 50px; padding: 0 18px; display: none; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(2, 132, 199, 0.35); cursor: pointer; z-index: 50; }
        #fabUploads.visible { display: inline-flex; }
        .fab-dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; }
        .fab-dot.pulse { background: #fde047; animation: pulseAnim 1s infinite; }
        .fab-dot.paused { background: #fb923c; }
        @keyframes pulseAnim { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

        /* Upload Queue Modal Styles */
        .queue-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; margin: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; }
        .queue-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
        .queue-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .queue-name { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .queue-status { font-size: 11px; font-weight: 600; margin-top: 3px; color: var(--muted); }
        .queue-status.uploading { color: var(--primary); }
        .queue-status.done { color: var(--success); }
        .queue-status.paused { color: var(--warn); }
        .queue-status.failed { color: var(--danger); }
        .queue-bar-track { width: 100%; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 6px; }
        .queue-bar-fill { height: 100%; background: var(--primary); transition: width 0.2s; }
        .queue-btns { display: flex; gap: 5px; flex-shrink: 0; }
        .q-btn { border: none; border-radius: 8px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .q-btn.cancel { background: var(--danger-soft); color: var(--danger); }
        .q-btn.retry { background: var(--primary-soft); color: var(--primary); }
        .q-btn.pause { background: var(--warn-soft); color: var(--warn); }

        /* Modals */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 250; padding: 16px; }
        .modal-backdrop.open { display: flex; }
        .modal-card { background: var(--surface); border-radius: 18px; width: 100%; max-width: 390px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: pop 0.18s ease-out; max-height: 82vh; display: flex; flex-direction: column; }
        @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .modal-desc { font-size: 14px; color: var(--muted); line-height: 1.45; margin-bottom: 14px; word-break: break-word; }
        .modal-input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; margin-bottom: 14px; outline: none; }
        .modal-input:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
        .modal-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; flex: 1; }
        .folder-opt { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text); }
        .folder-opt.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 700; }
        .folder-opt:active { background: var(--primary-soft); border-color: var(--primary); }

        /* Fullscreen Media Viewer */
        #mediaViewer { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; user-select: none; }
        #mediaViewer.open { display: flex; }
        .viewer-top { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; color: #fff; gap: 10px; background: rgba(0,0,0,0.65); z-index: 5; }
        .viewer-title-wrap { flex: 1; overflow: hidden; }
        .viewer-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .viewer-counter { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; touch-action: none; }
        .viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: center center; will-change: transform; transition: filter 0.25s ease; }
        .viewer-body img.blur-loading { filter: blur(8px); }
        .viewer-body video { max-width: 100%; max-height: 100%; border-radius: 6px; object-fit: contain; }

        .hd-badge { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.78); color: #e2e8f0; padding: 5px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; z-index: 12; pointer-events: none; backdrop-filter: blur(4px); }

        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.16); color: #fff; border: none; width: 42px; height: 52px; border-radius: 12px; font-size: 22px; font-weight: 700; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .nav-arrow:active { background: rgba(255,255,255,0.3); }
        .nav-prev { left: 10px; }
        .nav-next { right: 10px; }
        .nav-arrow.hidden { display: none; }

        .viewer-bottom { padding: 12px 16px; display: flex; justify-content: center; gap: 12px; background: rgba(0,0,0,0.7); z-index: 5; }
        .viewer-hint { text-align: center; color: #94a3b8; font-size: 11px; padding: 4px 10px; background: rgba(0,0,0,0.7); }

        #statusBar { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; font-weight: 500; display: none; z-index: 300; box-shadow: 0 8px 20px rgba(0,0,0,0.25); max-width: 90%; text-align: center; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="brand-header">
            <div class="brand-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
            </div>
            <h2>TeleCloud Drive</h2>
            <p>Private Personal Cloud Storage</p>
        </div>
        <div class="input-group">
            <label>License Key</label>
            <input type="text" id="inpKey" placeholder="e.g. VIP-DOST-1">
        </div>
        <div class="input-group">
            <label>Telegram Bot Token</label>
            <input type="password" id="inpToken" placeholder="123456:ABC-DEF...">
        </div>
        <div class="input-group">
            <label>Channel / Chat ID</label>
            <input type="text" id="inpChatId" placeholder="e.g. -100123456789">
        </div>
        <button class="btn btn-primary btn-full" onclick="login()">Enter Drive</button>
    </div>

    <div id="workspace">
        <!-- Normal Topbar -->
        <div class="topbar" id="normalTopbar">
            <div class="topbar-left">
                <div class="topbar-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                </div>
                <h1>TeleCloud</h1>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="btnView" onclick="toggleView()" title="Switch View"></button>
                <button class="icon-btn" onclick="fetchFromCloud()" title="Sync">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>
                <button class="icon-btn" onclick="confirmLogout()" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>

        <!-- Modern Multi-Select Batch Bar -->
        <div id="batchBar">
            <div class="batch-left">
                <button class="batch-btn" onclick="exitMultiSelect()" title="Cancel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <span id="selectedCountText">0 selected</span>
            </div>
            <div class="batch-actions" id="batchActionsWrap"></div>
        </div>

        <div class="controls-wrap">
            <div class="search-row">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" placeholder="Search in this folder..." oninput="renderFiles()">
                </div>
                <button class="sort-btn" onclick="openSortModal()" title="Sort">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
                    <span id="sortBtnLabel">Sort</span>
                </button>
            </div>
            <div class="action-pills">
                <button class="pill-btn primary" onclick="document.getElementById('fileInput').click()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload
                </button>
                <button class="pill-btn" onclick="openFolderModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
                    Folder
                </button>
                <button class="pill-btn" id="btnTrash" onclick="toggleTrash()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Bin
                </button>
            </div>
        </div>

        <input type="file" id="fileInput" multiple style="display:none" onchange="handleUploadSelection(this.files)">

        <div class="path-bar">
            <span class="path-text" id="pathDisplay">Home /</span>
            <button class="back-btn" id="btnBack" style="display:none" onclick="goBack()">← Back</button>
        </div>

        <div id="fileContainer" class="list-view"></div>
    </div>

    <!-- Floating Upload Manager Button -->
    <button id="fabUploads" onclick="openUploadModal()">

    <script>
        const FIREBASE_URL = "https://teledrive300-default-rtdb.firebaseio.com/";

        let licenseKey = localStorage.getItem("td_key") || "";

        let sortMode = localStorage.getItem("td_sort") || "newest";

        // Multi-select state
        let isMultiSelect = false;

        // Rename target
        let itemToRename = null;

        let uploadTasks = []; // { id, file, name, targetPath, status: 'queued'|'uploading'|'paused'|'waiting'|'done'|'failed'|'cancelled', progress: 0, note: '', xhr: null }
        let activeUploadCount = 0;
        const MAX_CONCURRENT_UPLOADS = 2;
        let wakeLock = null;

        // Media viewer state
        let currentMediaList = [];

        let isViewerOpen = false;

        // Zoom & Swipe state

        const urlCache = JSON.parse(sessionStorage.getItem("td_url_cache") || "{}");

        const ICONS = {

            play: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>`,
            pause: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
            close: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
        };

        // --- IndexedDB for Persistent Uploads across Page Refresh ---
        const IDB_NAME = "TeleCloudUploadsDB";
        const IDB_STORE = "tasks";

        function openUploadDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject("No IDB");
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE, { keyPath: "id" });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbSaveTask(task) {
            try {
                const db = await openUploadDB();
                const tx = db.transaction(IDB_STORE, "readwrite");
                tx.objectStore(IDB_STORE).put({
                    id: task.id,
                    name: task.name,
                    targetPath: task.targetPath,
                    file: task.file
                });
            } catch (e) {}
        }

        async function idbDeleteTask(id) {
            try {
                const db = await openUploadDB();
                const tx = db.transaction(IDB_STORE, "readwrite");
                tx.objectStore(IDB_STORE).delete(id);
            } catch (e) {}
        }

        async function restorePendingUploadsFromDB() {
            try {
                const db = await openUploadDB();
                const tx = db.transaction(IDB_STORE, "readonly");
                const req = tx.objectStore(IDB_STORE).getAll();
                req.onsuccess = () => {
                    const saved = req.result || [];
                    if (saved.length > 0) {
                        saved.forEach(s => {
                            if (!uploadTasks.some(t => t.id === s.id)) {
                                uploadTasks.push({
                                    id: s.id,
                                    file: s.file,
                                    name: s.name,
                                    targetPath: s.targetPath || "/",
                                    status: "paused",
                                    progress: 0,
                                    note: "Paused (Page refreshed)",
                                    xhr: null
                                });
                            }
                        });
                        updateUploadFab();
                        showStatus(`${saved.length} paused upload(s) mil gaye — Resume kar sakte hain!`);
                    }
                };
            } catch (e) {}
        }

        // --- Screen Wake Lock & Reload Protection during Uploads ---
        async function acquireWakeLock() {
            try {
                if ("wakeLock" in navigator && !wakeLock) {
                    wakeLock = await navigator.wakeLock.request("screen");
                    wakeLock.addEventListener("release", () => { wakeLock = null; });
                }
            } catch (e) {}
        }

        function releaseWakeLock() {
            if (wakeLock) { try { wakeLock.release(); } catch(e) {} wakeLock = null; }
        }

        document.addEventListener("visibilitychange", () => {
            const hasRunning = uploadTasks.some(t => t.status === "uploading" || t.status === "queued");
            if (document.visibilityState === "visible" && hasRunning) acquireWakeLock();
        });

        window.addEventListener("beforeunload", (e) => {
            if (uploadTasks.some(t => t.status === "uploading" || t.status === "queued")) {
                e.preventDefault();
                e.returnValue = "";
            }
        });

        // --- Hardware / Browser Back Button Handling ---
        history.replaceState({ view: "root" }, "");

        window.addEventListener("popstate", () => {
            const modals = ["confirmModal", "folderModal", "renameModal", "moveModal", "dlChoiceModal", "uploadModal", "sortModal"];
            for (const m of modals) {
                if (document.getElementById(m).classList.contains("open")) {
                    closeModal(m);
                    return;
                }
            }
            if (isViewerOpen) {
                closeViewerInternal();
                return;
            }
            if (isMultiSelect) {
                exitMultiSelectInternal();
                return;
            }
            if (inTrash) {
                inTrash = false;
                document.getElementById("btnTrash").classList.remove("trash-active");
                document.getElementById("searchInput").value = "";
                renderFiles();
                return;
            }
            if (currentPath !== "/") {
                const parts = currentPath.split("/").filter(Boolean);
                parts.pop();
                currentPath = parts.length ? "/" + parts.join("/") + "/" : "/";
                document.getElementById("searchInput").value = "";
                renderFiles();
            }
        });

        function showStatus(msg, autoHide = true) {
            const bar = document.getElementById("statusBar");
            bar.innerText = msg;
            bar.style.display = "block";
            clearTimeout(window.statusTimer);
            if (autoHide) window.statusTimer = setTimeout(() => bar.style.display = "none", 3200);
        }

        function openConfirm(title, desc, okText, okClass, onConfirm) {
            document.getElementById("confirmTitle").innerText = title;
            document.getElementById("confirmDesc").innerText = desc;
            const btn = document.getElementById("confirmOkBtn");
            btn.innerText = okText;
            btn.className = "btn " + okClass;
            btn.onclick = () => { closeModal("confirmModal"); onConfirm(); };
            document.getElementById("confirmModal").classList.add("open");
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("open");
        }

        function isImageFile(name = "") { return /\.(jpg|jpeg|png|webp|gif)$/i.test(name); }
        function isVideoFile(name = "") { return /\.(mp4|mkv|avi|mov|webm)$/i.test(name); }
        function isPdfFile(name = "") { return /\.pdf$/i.test(name); }

        async function getTelegramDirectUrl(fileId) {
            if (!fileId) return null;
            if (urlCache[fileId]) return urlCache[fileId];
            try {
                const res = await fetch(`https://api.telegram.org/bot${botToken}/getFile?file_id=${encodeURIComponent(fileId)}`);
                const data = await res.json();
                if (data.ok && data.result && data.result.file_path) {
                    const url = `https://api.telegram.org/file/bot${botToken}/${data.result.file_path}`;
                    urlCache[fileId] = url;
                    saveUrlCache();
                    return url;
                }
            } catch (e) {}
            return null;
        }

        function buildWorkerUrl(tgUrl, fileName, forceDownload = false) {
            return `${WORKER_URL}?url=${encodeURIComponent(tgUrl)}&name=${encodeURIComponent(fileName)}${forceDownload ? "&dl=1" : ""}`;
        }

        async function downloadSingleFileProperly(item) {
            showStatus(`Downloading ${item.name}...`, false);
            const tgUrl = await getTelegramDirectUrl(item.fileId);
            if (!tgUrl) return showStatus("File 20MB se badi hai ya expire ho gayi hai.");
            const dlUrl = buildWorkerUrl(tgUrl, item.name || "file", true);
            const a = document.createElement("a");
            a.href = dlUrl;
            a.download = item.name || "file";
            document.body.appendChild(a);
            a.click();
            a.remove();
            showStatus("Download started!");
        }

        const thumbObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const el = entry.target;
                thumbObserver.unobserve(el);
                const fid = el.dataset.thumbId;
                if (!fid) return;
                getTelegramDirectUrl(fid).then(url => {
                    if (url) {
                        const img = document.createElement("img");
                        img.src = url;
                        img.alt = "";
                        img.onload = () => { el.innerHTML = ""; el.appendChild(img); };
                    }
                });
            });
        }, { rootMargin: "150px" });

        async function login() {
            const k = document.getElementById("inpKey").value.trim();
            const t = document.getElementById("inpToken").value.trim();
            const c = document.getElementById("inpChatId").value.trim();
            if (!k || !t || !c) return showStatus("Saari details bhariye!");

            showStatus("Verifying Key...", false);
            try {
                const res = await fetch(`${FIREBASE_URL}valid_keys/${encodeURIComponent(k)}.json`);
                const val = await res.json();
                if (val === true || val === "true") {
                    licenseKey = k; botToken = t; chatId = c;
                    localStorage.setItem("td_key", k);
                    localStorage.setItem("td_token", t);
                    localStorage.setItem("td_chatId", c);
                    openWorkspace();
                } else {
                    showStatus("Invalid License Key!");
                }
            } catch (e) {
                showStatus("Network error! Dobara try karein.");
            }
        }

        function confirmLogout() {
            openConfirm("Logout?", "Kya aap TeleCloud se logout karna chahte hain?", "Logout", "btn-danger", () => {
                localStorage.removeItem("td_key");
                localStorage.removeItem("td_token");
                localStorage.removeItem("td_chatId");
                sessionStorage.removeItem("td_url_cache");
                location.reload();
            });
        }

        function openWorkspace() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("workspace").style.display = "block";
            updateSortLabel();
            updateViewUI();
            fetchFromCloud();
            restorePendingUploadsFromDB();
        }

        async function fetchFromCloud() {
            showStatus("Syncing...", false);
            try {
                const res = await fetch(`${FIREBASE_URL}users/${encodeURIComponent(licenseKey)}/channels/${encodeURIComponent(chatId)}.json`);
                const data = await res.json();
                fileHistory = (data && Array.isArray(data.fileHistory)) ? data.fileHistory : [];
                trashHistory = (data && Array.isArray(data.trashHistory)) ? data.trashHistory : [];
                renderFiles();
                showStatus("Synced!");
            } catch (e) {
                showStatus("Data load nahi ho paya.");
            }
        }

        async function syncToCloud() {
            try {
                await fetch(`${FIREBASE_URL}users/${encodeURIComponent(licenseKey)}/channels/${encodeURIComponent(chatId)}.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ fileHistory, trashHistory })
                });
            } catch (e) {
                showStatus("Cloud sync fail ho gaya.");
            }
        }

        // --- Persistent Sorting ---
        const SORT_OPTIONS = [
            { id: "newest", label: "Newest First", short: "Newest" },
            { id: "oldest", label: "Oldest First", short: "Oldest" },
            { id: "name_asc", label: "Name (A → Z)", short: "A–Z" },
            { id: "name_desc", label: "Name (Z → A)", short: "Z–A" }
        ];

        function updateSortLabel() {
            const found = SORT_OPTIONS.find(o => o.id === sortMode) || SORT_OPTIONS[0];
            document.getElementById("sortBtnLabel").innerText = found.short;
        }

        function openSortModal() {
            const list = document.getElementById("sortOptionsList");
            list.innerHTML = "";
            SORT_OPTIONS.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "folder-opt" + (sortMode === opt.id ? " active" : "");
                btn.innerHTML = `<span>${opt.label}</span>${sortMode === opt.id ? "<span>✓</span>" : ""}`;
                btn.onclick = () => {
                    sortMode = opt.id;
                    localStorage.setItem("td_sort", sortMode);
                    updateSortLabel();
                    closeModal("sortModal");
                    renderFiles();
                };
                list.appendChild(btn);
            });
            document.getElementById("sortModal").classList.add("open");
        }

        function applySortToList(arr, sourceArray) {
            const list = arr.slice();
            if (sortMode === "name_asc") {
                list.sort((a, b) => (a.name || "").localeCompare(b.name || "", undefined, { numeric: true, sensitivity: "base" }));
            } else if (sortMode === "name_desc") {
                list.sort((a, b) => (b.name || "").localeCompare(a.name || "", undefined, { numeric: true, sensitivity: "base" }));
            } else if (sortMode === "oldest") {
                list.sort((a, b) => sourceArray.indexOf(a) - sourceArray.indexOf(b));
            } else {
                // newest first
                list.sort((a, b) => sourceArray.indexOf(b) - sourceArray.indexOf(a));
            }
            return list;
        }

        // --- View & Pinch-to-Resize Grid ---
        function toggleView() {
            isGrid = !isGrid;
            localStorage.setItem("td_grid", isGrid);
            updateViewUI();
        }

        function updateViewUI() {
            const c = document.getElementById("fileContainer");
            c.style.setProperty("--grid-cols", gridCols);
            c.className = (isGrid ? "grid-view" : "list-view") + (isMultiSelect ? " multi-mode" : "");
            document.getElementById("btnView").innerHTML = isGrid ? ICONS.list : ICONS.grid;
        }

        const fileContainerEl = document.getElementById("fileContainer");
        fileContainerEl.addEventListener("touchstart", (e) => {
            if (isGrid && e.touches.length === 2) {
                gridPinchActive = true;
                gridPinchStartDist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
            }
        }, { passive: true });

        fileContainerEl.addEventListener("touchmove", (e) => {
            if (!gridPinchActive || !isGrid || e.touches.length !== 2) return;
            e.preventDefault();
            const dist = Math.hypot(
                e.touches[1].clientX - e.touches[0].clientX,
                e.touches[1].clientY - e.touches[0].clientY
            );
            const delta = dist - gridPinchStartDist;
            if (Math.abs(delta) > 55) {
                // Pinch out (positive delta) = larger thumbnails (fewer columns)
                // Pinch in (negative delta) = smaller thumbnails (more columns)
                const nextCols = delta > 0 ? Math.max(2, gridCols - 1) : Math.min(5, gridCols + 1);
                if (nextCols !== gridCols) {
                    gridCols = nextCols;
                    localStorage.setItem("td_grid_cols", gridCols);
                    fileContainerEl.style.setProperty("--grid-cols", gridCols);
                    showStatus(`Grid size: ${gridCols} columns`);
                }
                gridPinchStartDist = dist;
            }
        }, { passive: false });

        fileContainerEl.addEventListener("touchend", (e) => {
            if (e.touches.length < 2) gridPinchActive = false;
        }, { passive: true });

                try {
                    const res = await fetch(`https://api.telegram.org/bot${botToken}/deleteMessage?chat_id=${encodeURIComponent(chatId)}&message_id=${encodeURIComponent(msgId)}`);
                    if (res.status === 429) {
                        const data = await res.json().catch(() => ({}));
                        const waitSec = (data.parameters && data.parameters.retry_after) ? data.parameters.retry_after : 4;
                        showStatus(`Rate limit: ${waitSec}s ruk rahe hain...`, false);
                        await new Promise(r => setTimeout(r, (waitSec + 1) * 1000));
                        continue;

                    return;

        function openUploadModal() {

        async function handleUploadSelection(files) {
            if (inTrash) return showStatus("Pehle Recycle Bin se bahar aayein.");
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const task = {
                    id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
                    file: files[i],
                    name: files[i].name,
                    targetPath: currentPath,
                    status: "queued",
                    progress: 0,
                    note: "",
                    xhr: null
                };
                uploadTasks.push(task);
                idbSaveTask(task);
            }
            document.getElementById("fileInput").value = "";
            updateUploadFab();
            renderUploadQueue();
            openUploadModal();
            processUploadQueue();
        }

        function processUploadQueue() {
            while (activeUploadCount < MAX_CONCURRENT_UPLOADS) {
                const nextTask = uploadTasks.find(t => t.status === "queued");
                if (!nextTask) break;
                startUploadTask(nextTask);
            }
            const anyActive = uploadTasks.some(t => t.status === "uploading" || t.status === "queued" || t.status === "waiting");
            if (anyActive) acquireWakeLock();
            else releaseWakeLock();
        }

        async function startUploadTask(task) {
            task.status = "uploading";
            task.progress = 0;
            task.note = "";
            activeUploadCount++;
            updateUploadFab();
            renderUploadQueue();

            try {
                const thumbBlob = await createImageThumbnail(task.file);
                if (task.status === "cancelled" || task.status === "paused") return;

                let data = null;
                for (let attempt = 0; attempt < 4; attempt++) {
                    if (task.status === "cancelled" || task.status === "paused") return;
                    const res = await uploadTaskWithXhr(task, thumbBlob);
                    if (res.status === 429 || (res.json && res.json.error_code === 429)) {
                        const waitSec = (res.json && res.json.parameters && res.json.parameters.retry_after) ? res.json.parameters.retry_after : 6;
                        task.status = "waiting";
                        task.note = `Rate limit: ${waitSec}s ruk rahe hain...`;
                        renderUploadQueue();
                        await new Promise(r => setTimeout(r, (waitSec + 1) * 1000));
                        if (task.status === "cancelled" || task.status === "paused") return;
                        task.status = "uploading";
                        task.progress = 0;
                        task.note = "";
                        renderUploadQueue();
                        continue;
                    }
                    data = res.json;
                    break;
                }

                if (task.status === "cancelled" || task.status === "paused") return;

                if (data && data.ok && data.result) {
                    const r = data.result;
                    const doc = r.document || r.video || (r.photo ? r.photo[r.photo.length - 1] : null);
                    if (doc && doc.file_id) {
                        const thumbId = (doc.thumbnail && doc.thumbnail.file_id) || (doc.thumb && doc.thumb.file_id) || "";
                        fileHistory.push({
                            type: "file",
                            msgId: String(r.message_id),
                            fileId: doc.file_id,
                            name: task.name,
                            path: task.targetPath,
                            thumbFileId: thumbId
                        });
                        task.status = "done";
                        task.progress = 100;
                        task.file = null;
                        await idbDeleteTask(task.id);
                        await syncToCloud();
                        renderFiles();
                    } else {
                        task.status = "failed";
                    }
                } else {
                    task.status = "failed";
                }
            } catch (e) {
                if (task.status !== "cancelled" && task.status !== "paused") {
                    task.status = "failed";
                }
            } finally {
                task.xhr = null;
                activeUploadCount = Math.max(0, activeUploadCount - 1);
                updateUploadFab();
                renderUploadQueue();
                processUploadQueue();
            }
        }

        function uploadTaskWithXhr(task, thumbBlob) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append("chat_id", chatId);
                if (thumbBlob) formData.append("thumbnail", thumbBlob, "thumb.jpg");
                formData.append("document", task.file, task.name);

                const xhr = new XMLHttpRequest();
                task.xhr = xhr;
                xhr.open("POST", `https://api.telegram.org/bot${botToken}/sendDocument`);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const p = Math.round((e.loaded / e.total) * 100);
                        if (p !== task.progress) {
                            task.progress = p;
                            renderUploadQueue();
                        }
                    }
                };
                xhr.onload = () => {
                    let json = null;
                    try { json = JSON.parse(xhr.responseText); } catch (e) {}
                    resolve({ status: xhr.status, json });
                };
                xhr.onerror = () => reject(new Error("Network error"));
                xhr.onabort = () => reject(new Error("Aborted"));
                xhr.send(formData);
            });
        }

        function pauseUploadTask(id) {
            const task = uploadTasks.find(t => t.id === id);
            if (!task) return;
            task.status = "paused";
            task.note = "Paused";
            if (task.xhr) { try { task.xhr.abort(); } catch(e) {} }
            updateUploadFab();
            renderUploadQueue();
            processUploadQueue();
        }

        function resumeUploadTask(id) {
            const task = uploadTasks.find(t => t.id === id);
            if (!task || !task.file) return;
            task.status = "queued";
            task.progress = 0;
            task.note = "";
            updateUploadFab();
            renderUploadQueue();
            processUploadQueue();
        }

        function resumeAllPausedUploads() {
            uploadTasks.forEach(t => {
                if ((t.status === "paused" || t.status === "failed") && t.file) {
                    t.status = "queued";
                    t.progress = 0;
                    t.note = "";
                }
            });
            updateUploadFab();
            renderUploadQueue();
            processUploadQueue();
        }

        function cancelUploadTask(id) {
            const task = uploadTasks.find(t => t.id === id);
            if (!task) return;
            task.status = "cancelled";
            if (task.xhr) { try { task.xhr.abort(); } catch(e) {} }
            idbDeleteTask(id);
            uploadTasks = uploadTasks.filter(t => t.id !== id);
            updateUploadFab();
            renderUploadQueue();
            processUploadQueue();
        }

        function clearCompletedUploads() {
            uploadTasks = uploadTasks.filter(t => t.status !== "done");
            updateUploadFab();
            renderUploadQueue();
        }

        function updateUploadFab() {
            const fab = document.getElementById("fabUploads");
            const dot = document.getElementById("fabDot");
            const text = document.getElementById("fabText");
            if (uploadTasks.length === 0) {
                fab.classList.remove("visible");
                return;
            }
            fab.classList.add("visible");
            const active = uploadTasks.filter(t => t.status === "uploading" || t.status === "queued" || t.status === "waiting").length;
            const paused = uploadTasks.filter(t => t.status === "paused" || t.status === "failed").length;
            const done = uploadTasks.filter(t => t.status === "done").length;

            if (active > 0) {
                dot.className = "fab-dot pulse";
                text.innerText = `Uploading (${active})`;
            } else if (paused > 0) {
                dot.className = "fab-dot paused";
                text.innerText = `Paused (${paused})`;
            } else {
                dot.className = "fab-dot";
                text.innerText = `Uploads (${done} done)`;
            }
        }

        function renderUploadQueue() {
            const body = document.getElementById("uploadQueueBody");
            const resumeAllBtn = document.getElementById("btnResumeAll");
            if (!body) return;
            body.innerHTML = "";

            const activeList = uploadTasks.filter(t => t.status !== "done");
            const doneList = uploadTasks.filter(t => t.status === "done");
            const hasPaused = activeList.some(t => (t.status === "paused" || t.status === "failed") && t.file);
            if (resumeAllBtn) resumeAllBtn.style.display = hasPaused ? "inline-flex" : "none";

            if (uploadTasks.length === 0) {
                body.innerHTML = `<div class="empty-msg" style="padding:24px;">Abhi koi upload nahi hai</div>`;
                return;
            }

            if (activeList.length > 0) {
                const title = document.createElement("div");
                title.className = "queue-section-title";
                title.innerText = `Active / Queue (${activeList.length})`;
                body.appendChild(title);

                activeList.forEach(t => {
                    const div = document.createElement("div");
                    div.className = "queue-item";

                    let statusText = "Waiting in queue...";
                    let statusCls = "";
                    if (t.status === "uploading") { statusText = `Uploading... ${t.progress}%`; statusCls = "uploading"; }
                    else if (t.status === "waiting") { statusText = t.note || "Waiting (Rate limit)..."; statusCls = "paused"; }
                    else if (t.status === "paused") { statusText = t.note || "Paused"; statusCls = "paused"; }
                    else if (t.status === "failed") { statusText = "Failed (Tap resume)"; statusCls = "failed"; }

                    div.innerHTML = `
                        <div class="queue-top">
                            <div class="queue-name"></div>
                            <div class="queue-btns"></div>
                        </div>
                        <div class="queue-status ${statusCls}">${statusText}</div>
                        ${t.status === "uploading" ? `<div class="queue-bar-track"><div class="queue-bar-fill" style="width:${t.progress}%"></div></div>` : ""}
                    `;
                    div.querySelector(".queue-name").innerText = t.name;

                    const btns = div.querySelector(".queue-btns");
                    if (t.status === "uploading" || t.status === "queued" || t.status === "waiting") {
                        const pBtn = document.createElement("button");
                        pBtn.className = "q-btn pause";
                        pBtn.title = "Pause";
                        pBtn.innerHTML = ICONS.pause;
                        pBtn.onclick = () => pauseUploadTask(t.id);
                        btns.appendChild(pBtn);
                    } else if (t.file) {
                        const rBtn = document.createElement("button");
                        rBtn.className = "q-btn retry";
                        rBtn.title = "Resume";
                        rBtn.innerHTML = ICONS.play;
                        rBtn.onclick = () => resumeUploadTask(t.id);
                        btns.appendChild(rBtn);
                    }

                    const cBtn = document.createElement("button");
                    cBtn.className = "q-btn cancel";
                    cBtn.title = "Cancel";
                    cBtn.innerHTML = ICONS.close;
                    cBtn.onclick = () => cancelUploadTask(t.id);
                    btns.appendChild(cBtn);

                    body.appendChild(div);
                });
            }

            if (doneList.length > 0) {
                const title = document.createElement("div");
                title.className = "queue-section-title";
                title.innerText = `Completed (${doneList.length})`;
                body.appendChild(title);

                doneList.slice().reverse().forEach(t => {
                    const div = document.createElement("div");
                    div.className = "queue-item";
                    div.innerHTML = `
                        <div class="queue-top">
                            <div class="queue-name"></div>
                            <span style="color:var(--success);font-size:13px;font-weight:700;">✓</span>
                        </div>
                        <div class="queue-status done">Uploaded to ${t.targetPath}</div>
                    `;
                    div.querySelector(".queue-name").innerText = t.name;
                    body.appendChild(div);
                });
            }
        }

        function createImageThumbnail(file) {
            return new Promise((resolve) => {
                if (!file || !file.type || !file.type.startsWith("image/")) return resolve(null);
                const img = new Image();
                const objUrl = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(objUrl);
                    const scale = Math.min(320 / img.width, 320 / img.height, 1);
                    const canvas = document.createElement("canvas");
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.7);
                };
                img.onerror = () => { URL.revokeObjectURL(objUrl); resolve(null); };
                img.src = objUrl;
            });
        }

        // --- Media Viewer with Instant Blur-Up HD Loading, Zoom & Swipe ---
        function handleFileClick(item) {
            if (isImageFile(item.name) || isVideoFile(item.name)) {
                const idx = currentMediaList.findIndex(m => m === item || m.fileId === item.fileId);
                currentMediaIndex = idx !== -1 ? idx : 0;
                if (!isViewerOpen) {
                    isViewerOpen = true;
                    history.pushState({ view: "viewer" }, "");
                    document.getElementById("mediaViewer").classList.add("open");
                }
                showMediaAtIndex(currentMediaIndex);
            } else {
                downloadSingleFileProperly(item);
            }
        }

        function resetZoom() {
            zScale = 1; zX = 0; zY = 0;
            applyZoomTransform();
        }

        function applyZoomTransform() {
            const img = document.getElementById("activeZoomImg");
            if (img) img.style.transform = `translate3d(${zX}px, ${zY}px, 0) scale(${zScale})`;
        }

        async function showMediaAtIndex(idx) {
            if (idx < 0 || idx >= currentMediaList.length) return;
            currentMediaIndex = idx;
            resetZoom();

            const item = currentMediaList[idx];
            document.getElementById("viewerTitle").innerText = item.name;
            document.getElementById("viewerCounter").innerText = `${idx + 1} / ${currentMediaList.length}`;
            document.getElementById("btnPrevMedia").classList.toggle("hidden", idx === 0);
            document.getElementById("btnNextMedia").classList.toggle("hidden", idx === currentMediaList.length - 1);

            const content = document.getElementById("viewerContent");
            const hint = document.getElementById("viewerHint");
            content.innerHTML = "";
            hint.innerText = "";

            document.getElementById("viewerDownloadBtn").onclick = () => downloadSingleFileProperly(item);
            document.getElementById("viewerDeleteBtn").onclick = () => {
                openConfirm("Bin mein bhejein?", `Kya aap "${item.name}" ko Recycle Bin mein move karna chahte hain?`, "Move to Bin", "btn-danger", async () => {
                    await moveToTrash(item);
                    if (currentMediaList.length === 0) {
                        closeViewer();
                    } else {
                        const nextIdx = Math.min(currentMediaIndex, currentMediaList.length - 1);
                        showMediaAtIndex(nextIdx);
                    }
                });
            };

            if (isImageFile(item.name)) {
                hint.innerText = "Pinch ya double-tap se zoom karein • Swipe se next/prev";

                // Step 1: Instantly show cached thumbnail with blur-up
                const img = document.createElement("img");
                img.id = "activeZoomImg";
                img.draggable = false;

                const badge = document.createElement("div");
                badge.className = "hd-badge";
                badge.innerText = "Loading HD...";

                const thumbId = item.thumbFileId;
                const cachedThumbUrl = thumbId ? urlCache[thumbId] : null;

                if (cachedThumbUrl) {
                    img.src = cachedThumbUrl;
                    img.classList.add("blur-loading");
                    content.append(img, badge);
                } else {
                    content.innerHTML = `<div style="color:#94a3b8;font-size:14px;">Loading...</div>`;
                }

                // Step 2: Load Full HD image in background
                const fullUrl = await getTelegramDirectUrl(item.fileId);
                if (!isViewerOpen || currentMediaIndex !== idx) return;

                if (!fullUrl) {
                    if (!cachedThumbUrl) {
                        content.innerHTML = `<div style="color:#f87171;font-size:14px;padding:20px;text-align:center;">File 20MB se badi hai ya load nahi ho payi.</div>`;
                    } else {
                        badge.innerText = "HD unavailable (20MB+ limit)";
                    }
                    return;
                }

                const hdLoader = new Image();
                hdLoader.onload = () => {
                    if (!isViewerOpen || currentMediaIndex !== idx) return;
                    if (!content.contains(img)) {
                        content.innerHTML = "";
                        content.appendChild(img);
                    }
                    img.src = fullUrl;
                    img.classList.remove("blur-loading");
                    if (badge.parentNode) badge.remove();
                };
                hdLoader.onerror = () => {
                    if (badge.parentNode) badge.remove();
                };
                hdLoader.src = fullUrl;

                // Preload next photo URL quietly
                if (idx + 1 < currentMediaList.length && isImageFile(currentMediaList[idx + 1].name)) {
                    getTelegramDirectUrl(currentMediaList[idx + 1].fileId);
                }
            } else {
                content.innerHTML = `<div style="color:#94a3b8;font-size:14px;">Loading video...</div>`;
                const url = await getTelegramDirectUrl(item.fileId);
                if (!isViewerOpen || currentMediaIndex !== idx) return;
                if (!url) {
                    content.innerHTML = `<div style="color:#f87171;font-size:14px;padding:20px;text-align:center;">Video 20MB se badi hai ya load nahi ho payi.</div>`;
                    return;
                }
                content.innerHTML = "";
                const vid = document.createElement("video");
                vid.src = buildWorkerUrl(url, item.name, false);
                vid.controls = true;
                vid.autoplay = true;
                vid.playsInline = true;
                content.appendChild(vid);
                hint.innerText = "Swipe se next/prev media dekhein";
            }
        }

        function stepMedia(dir) {
            const next = currentMediaIndex + dir;
            if (next >= 0 && next < currentMediaList.length) showMediaAtIndex(next);
        }

        function closeViewer() {
            if (isViewerOpen) history.back();
        }

        function closeViewerInternal() {
            isViewerOpen = false;
            document.getElementById("mediaViewer").classList.remove("open");
            document.getElementById("viewerContent").innerHTML = "";
            resetZoom();
        }

        const viewerBody = document.getElementById("viewerBody");
        function getTouchDist(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        viewerBody.addEventListener("touchstart", (e) => {
            if (e.target.tagName === "VIDEO" || e.target.closest(".nav-arrow")) return;
            const img = document.getElementById("activeZoomImg");

            if (e.touches.length === 2 && img) {
                isPinching = true;
                isPanning = false;
                pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
                pinchStartScale = zScale;
            } else if (e.touches.length === 1) {
                const now = Date.now();
                if (img && now - lastTapTime < 280) {
                    if (zScale > 1.1) resetZoom();
                    else { zScale = 2.5; zX = 0; zY = 0; applyZoomTransform(); }
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                if (zScale > 1.05 && img) {
                    isPanning = true;
                    panStartX = touchStartX - zX;
                    panStartY = touchStartY - zY;
                }
            }
        }, { passive: true });

        viewerBody.addEventListener("touchmove", (e) => {
            if (e.target.tagName === "VIDEO") return;
            const img = document.getElementById("activeZoomImg");
            if (!img) return;

            if (isPinching && e.touches.length === 2) {
                const dist = getTouchDist(e.touches[0], e.touches[1]);
                zScale = Math.min(Math.max(pinchStartScale * (dist / pinchStartDist), 1), 4);
                if (zScale <= 1.02) { zX = 0; zY = 0; }
                applyZoomTransform();
            } else if (isPanning && e.touches.length === 1 && zScale > 1.05) {
                zX = e.touches[0].clientX - panStartX;
                zY = e.touches[0].clientY - panStartY;
                applyZoomTransform();
            }
        }, { passive: true });

        viewerBody.addEventListener("touchend", (e) => {
            if (e.target.tagName === "VIDEO" || e.target.closest(".nav-arrow")) return;

            if (isPinching && e.touches.length < 2) {
                isPinching = false;
                if (zScale < 1.05) resetZoom();
                return;
            }
            if (isPanning) {
                isPanning = false;
                return;
            }
            if (zScale <= 1.05 && e.changedTouches.length === 1) {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
                    if (dx < 0) stepMedia(1);
                    else stepMedia(-1);
                }
            }
        }, { passive: true });

        window.addEventListener("keydown", (e) => {
            if (!isViewerOpen) return;
            if (e.key === "ArrowRight") stepMedia(1);
            else if (e.key === "ArrowLeft") stepMedia(-1);
            else if (e.key === "Escape") closeViewer();
        });

        async function moveToTrash(item) {
            const idx = fileHistory.findIndex(x => x === item || JSON.stringify(x) === JSON.stringify(item));
            if (idx !== -1) {
                fileHistory.splice(idx, 1);
                trashHistory.push(item);
                renderFiles();
                await syncToCloud();
                showStatus("Bin mein move kar diya!");
            }
        }

        async function restoreItem(item) {
            const idx = trashHistory.findIndex(x => x === item || JSON.stringify(x) === JSON.stringify(item));
            if (idx !== -1) {
                trashHistory.splice(idx, 1);
                fileHistory.push(item);
                renderFiles();
                await syncToCloud();
                showStatus("Restore ho gaya!");
            }
        }

        async function deletePermanently(item) {
            const idx = trashHistory.findIndex(x => x === item || JSON.stringify(x) === JSON.stringify(item));
            if (idx === -1) return;
            showStatus("Deleting permanently...", false);
            if (item.msgId) await deleteTelegramMessageSafe(item.msgId);
            trashHistory.splice(idx, 1);
            renderFiles();
            await syncToCloud();
            showStatus("Permanently deleted!");
        }

        if (licenseKey && botToken && chatId) openWorkspace();
    </script>
